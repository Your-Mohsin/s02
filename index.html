
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Rose Model</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main></main>
    <div id="filter"></div>

    <!-- Import es-module-shims for import map support -->
    <script
      async
      src="https://ga.jspm.io/npm:es-module-shims@1.6.3/dist/es-module-shims.js"
      crossorigin="anonymous"
    ></script>

    <!-- Import map for Three.js and its addons -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
      }
    </script>

    <!-- Main JavaScript -->
    <script src="java.js" type="module"></script>
  </body>
</html>
